<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Làng Trung Ý vs Làng Trung Thành</title>
<style>
    body{margin:0;overflow:hidden;background:linear-gradient(to bottom,#87ceeb,#e0f7fa);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;user-select:none;}
    canvas{position:fixed;top:0;left:0;display:block;}
    #ui{
        position:absolute;top:15px;left:15px;color:#fff;z-index:10;
        text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none;
        background:rgba(15,23,42,.7);padding:15px 20px;border-radius:12px;
        border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);
        font-size:14px;line-height:1.8;min-width:280px;
        box-shadow:0 8px 32px rgba(0,0,0,.3);
    }
    #ui b{color:#ffcc00;}
    .team-red{color:#ff5252;font-weight:bold;}
    .team-blue{color:#448aff;font-weight:bold;}
    .stat-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:6px;overflow:hidden;}
    .stat-fill{height:100%;transition:width .3s ease;}
    .hp-fill{background:linear-gradient(90deg,#ff5252,#ff9800);}
    .spawn-fill{background:linear-gradient(90deg,#69f0ae,#00bfa5);}
    #minimap{
        position:absolute;bottom:20px;right:20px;width:180px;height:180px;
        border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.8);
        z-index:10;border-radius:12px;overflow:hidden;backdrop-filter:blur(5px);
        box-shadow:0 4px 20px rgba(0,0,0,.5);
    }
    #winScreen{
        position:absolute;top:0;left:0;width:100%;height:100%;
        background:radial-gradient(circle at center,rgba(20,20,40,.95),rgba(0,0,0,.98));
        display:none;justify-content:center;align-items:center;flex-direction:column;z-index:100;color:#fff;text-align:center;
    }
    #winScreen h1{font-size:4rem;margin:0;text-shadow:0 0 20px currentColor;letter-spacing:2px;font-family:'Impact',sans-serif;}
    #winScreen .sub{font-size:1.2rem;margin-bottom:30px;color:#aaa;}
    #winScreen button{
        padding:14px 40px;font-size:1.2rem;background:linear-gradient(135deg,#ffcc00,#ff9900);
        border:none;border-radius:50px;cursor:pointer;color:#1a1a2e;font-weight:bold;
        transition:all .3s ease;box-shadow:0 4px 15px rgba(255,204,0,.4);
    }
    #winScreen button:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(255,204,0,.6);}
</style>
</head>
<body>

<div id="ui">
    <div class="title-game">⚔️ CHIẾN TRƯỜNG TRUNG Ý</div>
    <div>Phe: <span class="team-red">🔴 Làng Trung Ý (Bạn)</span> vs <span class="team-blue">🔵 Làng Trung Thành (Địch)</span></div>
    <div>Nhà chính: <span id="hpRed">100%</span> vs <span id="hpBlue">100%</span></div>
    <div>Lính: <span id="countRed">0</span> / <span id="maxUnits">50</span> | Địch: <span id="countBlue">0</span></div>
    <div>WASD/Mũi tên: Di chuyển cam | Lăn chuột: Zoom | Click Trái: Chọn | Click Phải: Ra lệnh</div>
    <div class="stat-bar"><div id="spawnBarRed" class="stat-fill spawn-fill" style="width:0%"></div></div>
</div>

<canvas id="minimap"></canvas>

<div id="winScreen">
    <h1 id="winText">KẾT QUẢ CHIẾN DỊCH</h1>
    <div class="sub" id="winSub">Làng nào tiêu diệt hết nhà chính sẽ lên ngôi vương.</div>
    <button onclick="location.reload()">CHIẾN ĐẤU LẠI</button>
</div>

<!-- Three.js CDN (không dùng importmap) -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"></script>

<script>
/* ==================== CẤU HÌNH GAME ==================== */
const CONFIG = {
    MAP_SIZE: 140,
    UNIT_CAP: 60,
    SPAWN_INTERVAL: 3.5,
    UNIT_SPEED: 3.2,
    ATTACK_RANGE: 2.2,
    ATTACK_DMG: 10,
    ATTACK_SPEED: 1.0,
    UNIT_HP: 60,
    BASE_HP: 800,
    FOG_DENSITY: 0.010,
};

/* =============== TẠO CANVAS & RENDERER =============== */
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

/* =============== SCENE & CAMERA =============== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);          // nền xanh dương (trời)
scene.fog = new THREE.FogExp2(0x87ceeb, CONFIG.FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 55, 35);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enablePan = true;
controls.enableRotate = true;
controls.enableZoom = true;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 15;
controls.maxDistance = 90;
controls.target.set(0, 0, 0);
controls.update();

/* =============== LIGHTING =============== */
const sunLight = new THREE.DirectionalLight(0xfff0c0, 1.0);
sunLight.position.set(50, 80, 30);
scene.add(sunLight);

const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
scene.add(ambientLight);

const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a7d2b, 0.5);
scene.add(hemiLight);

const redPoint = new THREE.PointLight(0xff3333, 0.8, 100);
redPoint.position.set(0, 5, -60);
scene.add(redPoint);

const bluePoint = new THREE.PointLight(0x3366ff, 0.8, 100);
bluePoint.position.set(0, 5, 60);
scene.add(bluePoint);

/* =============== MATERIALS =============== */
const Mat = {
    ground: new THREE.MeshStandardMaterial({ map: (function(){
        const c=document.createElement('canvas');c.width=512;c.height=512;
        const ctx=c.getContext('2d');ctx.fillStyle='#2d5016';ctx.fillRect(0,0,512,512);
        ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=2;
        const g=32;for(let i=0;i<=512;i+=g){
            ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,512);ctx.stroke();
            ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(512,i);ctx.stroke();
        }
        const grads=[];for(let i=0;i<100;i++){
            const x=Math.random()*512,y=Math.random()*512,r=Math.random()*20+5;
            const g=ctx.createRadialGradient(x,y,0,x,y,r);
            g.addColorStop(0,'rgba(0,0,0,0.2)');g.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
        }
        const tex=new THREE.CanvasTexture(c);
        tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(20,20);tex.anisotropy=8;
        return tex;
    })()}, roughness:0.95, metalness:0, flatShading:true}),
    water: new THREE.MeshStandardMaterial({ color:0x1565c0, roughness:0.1, metalness:0.3, transparent:true, opacity:0.85, flatShading:true }),
    baseRed: new THREE.MeshStandardMaterial({ color:0xb71c1c, roughness:0.6, flatShading:true, emissive:0x440000, emissiveIntensity:0.5 }),
    baseBlue: new THREE.MeshStandardMaterial({ color:0x0d47a1, roughness:0.6, flatShading:true, emissive:0x000044, emissiveIntensity:0.5 }),
    unitRed: new THREE.MeshStandardMaterial({ color:0xd32f2f, roughness:0.5, flatShading:true, emissive:0x330000, emissiveIntensity:0.2 }),
    unitBlue: new THREE.MeshStandardMaterial({ color:0x1976d2, roughness:0.5, flatShading:true, emissive:0x000033, emissiveIntensity:0.2 }),
    hpBarBg: new THREE.MeshBasicMaterial({ color:0x000000, side:THREE.DoubleSide, transparent:true, opacity:0.6, depthTest:false }),
    hpBarRed: new THREE.MeshBasicMaterial({ color:0xff1744, side:THREE.DoubleSide, depthTest:false }),
    hpBarBlue: new THREE.MeshBasicMaterial({ color:0x448aff, side:THREE.DoubleSide, depthTest:false }),
    selectRing: new THREE.MeshBasicMaterial({ color:0xffcc00, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthTest:false }),
    laser: new THREE.MeshBasicMaterial({ color:0xffeb3b, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false }),
    particle: new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false })
};

/* =============== ĐỐI TƯỢNG =============== */
const units = [];
const bases = [];
const particles = [];
const lasers = [];
let selectedUnits = [];
let gameOver = false;
const clock = new THREE.Clock();
let spawnTimerRed = 0, spawnTimerBlue = 0;

/* =============== TẠO MAP =============== */
function initMap() {
    // Đất
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(CONFIG.MAP_SIZE, CONFIG.MAP_SIZE, 1, 1),
        Mat.ground
    );
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Sông
    const river = new THREE.Mesh(
        new THREE.PlaneGeometry(CONFIG.MAP_SIZE, 14, 1, 1),
        Mat.water
    );
    river.rotation.x = -Math.PI/2;
    river.position.y = 0.05;
    scene.add(river);

    // Cây (InstancedMesh)
    const treeCount = 250;
    const trunkGeo = new THREE.CylinderGeometry(0.25,0.4,2.2,5);
    const leafGeo = new THREE.ConeGeometry(1.2,2.5,5);
    const trunk = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({color:0x3e2723, flatShading:true}), treeCount);
    const leaf  = new THREE.InstancedMesh(leafGeo , new THREE.MeshStandardMaterial({color:0x2e7d32, flatShading:true}), treeCount);
    scene.add(trunk); scene.add(leaf);

    const dummy = new THREE.Object3D();
    for(let i=0;i<treeCount;i++){
        const side = Math.random()<0.5?-1:1;
        const x = (Math.random()-0.5)*CONFIG.MAP_SIZE*0.8;
        const z = side*(8+Math.random()*(CONFIG.MAP_SIZE/2-12));
        const s = 0.7+Math.random()*0.5;
        dummy.position.set(x,0,z);
        dummy.scale.setScalar(s);
        dummy.updateMatrix();
        trunk.setMatrixAt(i,dummy.matrix);
        leaf.setMatrixAt(i,dummy.matrix);
    }
    trunk.instanceMatrix.needsUpdate = true;
    leaf.instanceMatrix.needsUpdate = true;

    // Nhà chính
    createBase(new THREE.Vector3(0,0,-CONFIG.MAP_SIZE/2+12),'red');
    createBase(new THREE.Vector3(0,0, CONFIG.MAP_SIZE/2-12),'blue');
}

/* =============== TẠO BASE =============== */
function createBase(pos,team){
    const group = new THREE.Group();
    group.position.copy(pos);

    const body = new THREE.Mesh(new THREE.BoxGeometry(10,7,10), team==='red'?Mat.baseRed:Mat.baseBlue);
    body.position.y = 3.5;
    group.add(body);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(7,4,4), team==='red'?Mat.baseRed:Mat.baseBlue);
    roof.position.y = 7+2;
    roof.rotation.y = Math.PI/4;
    group.add(roof);

    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,12,6), new THREE.MeshStandardMaterial({color:0x222, flatShading:true}));
    pole.position.set(6,6,6);
    group.add(pole);

    const flag = new THREE.Mesh(
        new THREE.PlaneGeometry(3,2),
        new THREE.MeshBasicMaterial({color:team==='red'?0xff0000:0x0000ff, side:THREE.DoubleSide, transparent:true, opacity:0.9})
    );
    flag.position.set(6,13,6);
    flag.rotation.y = -Math.PI/2;
    group.add(flag);
    flag.userData.wobble = Math.random()*100;

    const aura = new THREE.Mesh(
        new THREE.RingGeometry(6,8,32),
        new THREE.MeshBasicMaterial({color:team==='red'?0xff0000:0x0000ff, transparent:true, opacity:0.15, side:THREE.DoubleSide, depthWrite:false})
    );
    aura.rotation.x = -Math.PI/2;
    aura.position.y = 0.1;
    group.add(aura);

    scene.add(group);
    bases.push({
        mesh:group,
        team:team,
        hp:CONFIG.BASE_HP,
        maxHp:CONFIG.BASE_HP,
        spawnTimer:0,
        flagMesh:flag,
        auraMesh:aura
    });
}

/* =============== PARTICLES & LASERS =============== */
function spawnLaser(startPos,endPos){
    const dir = new THREE.Vector3().subVectors(endPos,startPos);
    const len = dir.length();
    const mid = new THREE.Vector3().addVectors(startPos,endPos).multiplyScalar(0.5);
    const laserGeo = new THREE.PlaneGeometry(0.1,len);
    const laser = new THREE.Mesh(laserGeo,Mat.laser);
    laser.position.copy(mid);
    laser.lookAt(endPos);
    laser.rotateY(Math.PI/2);
    scene.add(laser);
    lasers.push({mesh:laser,life:0.15});
}
function spawnExplosion(pos,color=0xffaa00){
    const cnt=8;
    for(let i=0;i<cnt;i++){
        const g = new THREE.PlaneGeometry(0.5,0.5);
        const m = new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
        const p = new THREE.Mesh(g,m);
        p.position.copy(pos);
        p.position.y = 0.5;
        const a = Math.random()*Math.PI*2;
        const s = 3+Math.random()*5;
        p.userData.vel = new THREE.Vector3(Math.cos(a)*s,2+Math.random()*3,Math.sin(a)*s);
        p.userData.life = 0.6;
        p.userData.rot = (Math.random()-0.5)*3;
        scene.add(p);
        particles.push(p);
    }
}

/* =============== UNIT (LINH) =============== */
function createUnit(pos,team){
    if(units.filter(u=>u.team===team && u.state!=='dead').length >= CONFIG.UNIT_CAP) return null;

    const group = new THREE.Group();
    group.position.copy(pos);

    const bodyMat = team==='red'?Mat.unitRed:Mat.unitBlue;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.7,1.4,6), bodyMat);
    body.position.y = 0.7;
    group.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4,8,6), bodyMat);
    head.position.y = 1.6;
    group.add(head);

    const legMat = new THREE.MeshStandardMaterial({color:0x222, flatShading:true});
    const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,1,4), legMat);
    leg1.position.set(-0.2,0.3,0.2);
    const leg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,1,4), legMat);
    leg2.position.set(0.2,0.3,-0.2);
    group.add(leg1); group.add(leg2);
    group.userData.legs=[leg1,leg2];

    const weapon = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1.6,4), new THREE.MeshStandardMaterial({color:0xffcc00, flatShading:true, emissive:0x332200}));
    weapon.position.set(0.4,1.3,0.3);
    weapon.rotation.z = -0.6;
    group.add(weapon);

    const hpBg = new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.18),Mat.hpBarBg);
    const hpFill = new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.18), team==='red'?Mat.hpBarRed:Mat.hpBarBlue);
    hpBg.position.y = 2.5;
    hpFill.position.y = 2.51;
    group.add(hpBg); group.add(hpFill);

    const ring = new THREE.Mesh(new THREE.RingGeometry(0.6,0.8,16),Mat.selectRing);
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.05;
    ring.visible = false;
    group.add(ring);

    scene.add(group);

    const unit = {
        mesh:group,
        team:team,
        hp:CONFIG.UNIT_HP,
        maxHp:CONFIG.UNIT_HP,
        speed:CONFIG.UNIT_SPEED+(Math.random()-0.2)*0.4,
        state:'idle',
        target:null,
        targetPos:null,
        attackCooldown:0,
        hpBarFill:hpFill,
        selectRing:ring,
        legs:[leg1,leg2],
        walkTime:Math.random()*10,
        velocity:new THREE.Vector3(),
    };
    units.push(unit);
    return unit;
}

/* =============== LOGIC UPDATE =============== */
function updateUnits(delta){
    if(gameOver) return;

    // spawn
    bases.forEach(b=>{
        b.spawnTimer -= delta;
        b.flagMesh.scale.x = 0.8 + Math.sin(performance.now()*0.002 + b.flagMesh.userData.wobble)*0.2;
        b.auraMesh.material.opacity = 0.1 + Math.sin(performance.now()*0.001)*0.05;

        if(b.spawnTimer<=0 && units.filter(u=>u.team===b.team && u.state!=='dead').length < CONFIG.UNIT_CAP){
            const sp = b.mesh.position.clone();
            sp.x += (Math.random()-0.5)*6;
            sp.z += (b.team==='red'?12:-12)+(Math.random()-0.5)*2;
            createUnit(sp,b.team);
            b.spawnTimer = CONFIG.SPAWN_INTERVAL;
        }
    });

    const alive = units.filter(u=>u.state!=='dead');
    const redUnits = alive.filter(u=>u.team==='red');
    const blueUnits = alive.filter(u=>u.team==='blue');

    alive.forEach(u=>{
        if(u.state==='dead') return;
        u.attackCooldown -= delta;

        const isRed = u.team==='red';
        const enemies = isRed?blueUnits:redUnits;
        const enemyBases = bases.filter(b=>b.team!==u.team);

        // idle / move
        if(u.state==='idle' || u.state==='move'){
            if(u.targetPos && !isRed) u.targetPos=null;
            if(u.targetPos){
                const d = u.mesh.position.distanceTo(u.targetPos);
                if(d<1.5){ u.targetPos=null; u.state='idle'; }
                else { u.state='move'; }
            }else{
                let closest = Infinity, tgt=null;
                enemies.forEach(e=>{
                    const d = u.mesh.position.distanceTo(e.mesh.position);
                    if(d<closest){closest=d; tgt=e;}
                });
                enemyBases.forEach(b=>{
                    const d = u.mesh.position.distanceTo(b.mesh.position);
                    if(d<closest){closest=d; tgt=b;}
                });
                if(tgt){
                    u.target=tgt;
                    const range = tgt.maxHp>100?5:CONFIG.ATTACK_RANGE;
                    if(closest<range){
                        u.state='attack';
                    }else{
                        u.state='move';
                        u.targetPos = tgt.mesh.position.clone();
                    }
                }
            }
        }

        // move
        if(u.state==='move' && u.targetPos){
            moveUnit(u,u.targetPos,delta);
        }

        // attack
        if(u.state==='attack' && u.target){
            if(u.target.hp!==undefined && u.target.hp<=0){ u.target=null; u.state='idle'; return; }
            if(u.target.mesh && !scene.getObjectById(u.target.mesh.id)){ u.target=null; u.state='idle'; return; }

            const targPos = u.target.mesh.position;
            const dist = u.mesh.position.distanceTo(targPos);
            const range = u.target.maxHp>100?5:CONFIG.ATTACK_RANGE;

            if(dist>range){
                u.state='move';
                u.targetPos = targPos.clone();
            }else{
                const dir = new THREE.Vector3().subVectors(targPos,u.mesh.position).normalize();
                dir.y=0;
                if(dir.lengthSq()>0.001) u.mesh.lookAt(targPos.x,u.mesh.position.y,targPos.z);
                if(u.attackCooldown<=0){
                    const bs = u.mesh.position.clone(); bs.y=1.2;
                    const be = targPos.clone(); be.y = u.target.maxHp>100?4:1.2;
                    spawnLaser(bs,be);
                    spawnExplosion(be, u.team==='red'?0xff5252:0x448aff);
                    dealDamage(u.target,CONFIG.ATTACK_DMG);
                    u.attackCooldown = CONFIG.ATTACK_SPEED;
                    u.mesh.position.addScaledVector(dir,-0.3);
                }
            }
        }

        // idle bob & leg animation
        if(u.state==='idle' || u.state==='move'){
            u.walkTime += delta*(u.state==='move'?12:2);
            const bob = Math.sin(u.walkTime)*0.05;
            u.mesh.position.y = bob;
            const legOff = Math.sin(u.walkTime)*0.4;
            u.legs[0].rotation.x = legOff;
            u.legs[1].rotation.x = -legOff;
        }else{
            u.legs[0].rotation.x = 0;
            u.legs[1].rotation.x = 0;
        }

        // hp bar
        if(u.hp < u.maxHp){
            u.hpFill.scale.x = Math.max(0,u.hp/u.maxHp);
            u.hpFill.position.x = (u.hpFill.scale.x-1)*0.6;
            u.hpFill.visible = true;
        }else{
            u.hpFill.visible = false;
        }
        u.hpFill.lookAt(camera.position);
        u.hpFill.rotateY(Math.PI);
    });

    // particles
    for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.userData.life -= delta;
        if(p.userData.life<=0){ scene.remove(p); particles.splice(i,1); continue; }
        p.position.addScaledVector(p.userData.vel,delta);
        p.userData.vel.y -=5*delta;
        p.material.opacity = p.userData.life/0.6;
        p.rotation.z += p.userData.rot*delta;
    }

    // lasers
    for(let i=lasers.length-1;i>=0;i--){
        const l = lasers[i];
        l.life -= delta;
        if(l.life<=0){ scene.remove(l.mesh); lasers.splice(i,1); }
        else l.mesh.material.opacity = l.life/0.15;
    }
}

/* =============== MOVE UNIT =============== */
function moveUnit(unit,targetPos,delta){
    const pos = unit.mesh.position;
    const dir = new THREE.Vector3().subVectors(targetPos,pos).normalize();
    dir.y=0;

    // separation
    const sep = new THREE.Vector3();
    const sepR = 1.2;
    units.forEach(o=>{
        if(o===unit || o.state==='dead') return;
        const d = pos.distanceTo(o.mesh.position);
        if(d<sepR && d>0.01){
            const diff = new THREE.Vector3().subVectors(pos,o.mesh.position);
            sep.addScaledVector(diff.normalize(),(sepR-d)*1.5);
        }
    });

    const moveVec = new THREE.Vector3().addVectors(dir,sep.clampLength(0,unit.speed*0.5)).normalize();
    pos.addScaledVector(moveVec,unit.speed*delta);

    const half = CONFIG.MAP_SIZE/2-3;
    pos.x = THREE.MathUtils.clamp(pos.x,-half,half);
    pos.z = THREE.MathUtils.clamp(pos.z,-half,half);

    if(moveVec.lengthSq()>0.001){
        const targetRot = Math.atan2(moveVec.x,moveVec.z);
        unit.mesh.rotation.y = THREE.MathUtils.lerp(unit.mesh.rotation.y,targetRot,0.15);
    }
}

/* =============== DAMAGE =============== */
function dealDamage(target,amount){
    target.hp -= amount;
    if(target.hp<=0){
        target.hp=0;
        if(target.mesh){
            target.state='dead';
            target.mesh.visible=false;
            target.hpFill.visible=false;
            target.selectRing.visible=false;
            selectedUnits = selectedUnits.filter(u=>u!==target);
        }else{
            gameOver=true;
            const win = target.team==='red'?'LÀNG TRUNG Ý':'LÀNG TRUNG THÀNH / TRUNG CHÍNH';
            document.getElementById('winText').innerText = `${win} CHIẾN THẮNG!`;
            document.getElementById('winSub').innerText = target.team==='red'?
                "Trung Ý trung thành bảo vệ được Gottland.":
                "Trung Thành và Trung Chính trung nghĩa chiếm lĩnh chiến trường.";
            document.getElementById('winScreen').style.display='flex';
        }
    }
}

/* =============== MINIMAP =============== */
function renderMinimap(){
    const ctx = document.getElementById('minimap').getContext('2d');
    const w = ctx.canvas.width, h = ctx.canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0,h/2-6,w,12);

    bases.forEach(b=>{
        const x = (b.mesh.position.x + CONFIG.MAP_SIZE/2)*(180/CONFIG.MAP_SIZE);
        const y = (b.mesh.position.z + CONFIG.MAP_SIZE/2)*(180/CONFIG.MAP_SIZE);
        ctx.fillStyle = b.team==='red'? '#b71c1c' : '#0d47a1';
        ctx.fillRect(x-6,y-6,12,12);
        ctx.fillStyle = '#000'; ctx.fillRect(x-6,y-10,12,2);
        ctx.fillStyle = '#4caf50'; ctx.fillRect(x-6,y-10,12*(b.hp/b.maxHp),2);
    });

    units.forEach(u=>{
        if(u.state==='dead') return;
        const x = (u.mesh.position.x + CONFIG.MAP_SIZE/2)*(180/CONFIG.MAP_SIZE);
        const y = (u.mesh.position.z + CONFIG.MAP_SIZE/2)*(180/CONFIG.MAP_SIZE);
        ctx.fillStyle = u.team==='red'? '#ef5350' : '#42a5f5';
        ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    });

    const camX = (camera.position.x + CONFIG.MAP_SIZE/2)*(180/CONFIG.MAP_SIZE);
    const camZ = (camera.position.z + CONFIG.MAP_SIZE/2)*(180/CONFIG.MAP_SIZE);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(camX,camZ,35,0,Math.PI*2); ctx.stroke();
}

/* =============== INPUT =============== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function getWorldPos(event){
    mouse.x = (event.clientX/window.innerWidth)*2-1;
    mouse.y = -(event.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
    const intersect = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane,intersect);
    return intersect;
}

window.addEventListener('pointerdown',e=>{
    if(e.target.id==='winScreen') return;
    const world = getWorldPos(e);
    if(e.button===0){ // left click
        raycaster.setFromCamera(mouse,camera);
        const pickable = units.filter(u=>u.team==='red' && u.state!=='dead').map(u=>u.mesh);
        const hits = raycaster.intersectObjects(pickable,true);
        if(e.shiftKey || e.ctrlKey){
            if(hits.length){
                const u = units.find(u=>u.mesh===hits[0].object.parent || u.mesh===hits[0].object);
                if(u && !selectedUnits.includes(u)) selectUnit(u,true);
            }
        }else{
            clearSelection();
            if(hits.length){
                const u = units.find(u=>u.mesh===hits[0].object.parent || u.mesh===hits[0].object);
                if(u) selectUnit(u);
            }
        }
    }else if(e.button===2){ // right click -> command
        e.preventDefault();
        if(selectedUnits.length){
            selectedUnits.forEach((u,i)=>{
                const off = new THREE.Vector3((i%5-2)*1.8,0,Math.floor(i/5)*1.8);
                u.targetPos = world.clone().add(off);
                u.target = null;
                u.state='move';
            });
        }
    }
});

window.addEventListener('contextmenu',e=>e.preventDefault());

function selectUnit(unit,keepPrev=false){
    if(!keepPrev) clearSelection();
    selectedUnits.push(unit);
    unit.selectRing.visible = true;
}
function clearSelection(){
    selectedUnits.forEach(u=>u.selectRing.visible=false);
    selectedUnits=[];
}

/* =============== KEYBOARD =============== */
const keyState = {};
window.addEventListener('keydown',e=>keyState[e.code]=true);
window.addEventListener('keyup',e=>keyState[e.code]=false);

function handleKeyboard(delta){
    const speed = 35*delta;
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward); forward.y=0; forward.normalize();
    const right = new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0));

    if(keyState['KeyW']||keyState['ArrowUp']) controls.target.addScaledVector(forward,-speed);
    if(keyState['KeyS']||keyState['ArrowDown']) controls.target.addScaledVector(forward,speed);
    if(keyState['KeyA']||keyState['ArrowLeft']) controls.target.addScaledVector(right,-speed);
    if(keyState['KeyD']||keyState['ArrowRight']) controls.target.addScaledVector(right,speed);

    const half = CONFIG.MAP_SIZE/2;
    controls.target.x = THREE.MathUtils.clamp(controls.target.x,-half,half);
    controls.target.z = THREE.MathUtils.clamp(controls.target.z,-half,half);
    controls.update();
}

/* =============== UI UPDATE =============== */
function updateUI(){
    const redBase = bases.find(b=>b.team==='red');
    const blueBase = bases.find(b=>b.team==='blue');
    const redUnits = units.filter(u=>u.team==='red' && u.state!=='dead');
    const blueUnits = units.filter(u=>u.team==='blue' && u.state!=='dead');

    document.getElementById('hpRed').innerText = `${Math.ceil(redBase.hp/redBase.maxHp*100)}%`;
    document.getElementById('hpBlue').innerText = `${Math.ceil(blueBase.hp/blueBase.maxHp*100)}%`;
    document.getElementById('countRed').innerText = redUnits.length;
    document.getElementById('countBlue').innerText = blueUnits.length;
    document.getElementById('spawnBarRed').style.width = `${(1 - redBase.spawnTimer/CONFIG.SPAWN_INTERVAL)*100}%`;
}

/* =============== MAIN LOOP =============== */
function animate(){
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(),0.1);
    if(!gameOver){
        handleKeyboard(delta);
        updateUnits(delta);
        updateUI();
        renderMinimap();
    }
    controls.update();
    renderer.render(scene,camera);
}
function init(){
    initMap();
    animate();
}
init();

/* =============== RESIZE =============== */
window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
